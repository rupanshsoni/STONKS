services:
  - type: web
    name: stonks-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn stonks.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALPACA_MODE
        value: paper
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TICK_SECONDS
        value: "1800"
      - key: CORS_ALLOW_ORIGIN
        sync: false
